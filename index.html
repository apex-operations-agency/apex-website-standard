<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apex Website Standard</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#18212b; --muted:#5d6876; --line:#d3d9e0;
  --g1:#e4e8ee; --g2:#cdd4dd; --g3:#aab4c0; --dark:#2a333e; --darkInk:#ffffff; --darkMuted:#a9b3bf;
  --accent:#1f6feb; --accentInk:#ffffff; --pend:#8a5a00; --pendBg:#fff1c7; --no:#b42318; --noBg:#fdecea;
  --gel:#1a7f5a; --gelBg:#e6f6ef; --std:#6b3fb5; --stdBg:#f1ebfb; --add:#0b6b8a; --addBg:#e3f4fa;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1319; --panel:#161c24; --ink:#e6ebf1; --muted:#9ba7b5; --line:#2b3540;
    --g1:#222b36; --g2:#2e3946; --g3:#465464; --dark:#0a0e13; --darkMuted:#8995a3;
    --accent:#4d8dff; --pend:#ffcf66; --pendBg:#3a2d0c; --no:#ff8a80; --noBg:#3a1a18;
    --gel:#5fd1a4; --gelBg:#10291f; --std:#c3a6ff; --stdBg:#22183a; --add:#6cd0f0; --addBg:#0d2730;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1319; --panel:#161c24; --ink:#e6ebf1; --muted:#9ba7b5; --line:#2b3540;
  --g1:#222b36; --g2:#2e3946; --g3:#465464; --dark:#0a0e13; --darkMuted:#8995a3;
  --accent:#4d8dff; --pend:#ffcf66; --pendBg:#3a2d0c; --no:#ff8a80; --noBg:#3a1a18;
  --gel:#5fd1a4; --gelBg:#10291f; --std:#c3a6ff; --stdBg:#22183a; --add:#6cd0f0; --addBg:#0d2730;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;flex:1 1 260px}
.top h1 small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.toggle button{border:0;background:transparent;padding:7px 14px;cursor:pointer}
.toggle button.on{background:var(--accent);color:var(--accentInk)}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 58px)}
nav.side{border-right:1px solid var(--line);background:var(--panel);padding:10px 8px;position:sticky;top:58px;align-self:start;max-height:calc(100vh - 58px);overflow:auto}
nav.side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 8px 4px}
nav.side button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:14px}
nav.side button:hover{background:var(--g1)}
nav.side button.on{background:var(--accent);color:var(--accentInk)}
main{padding:20px 16px 70px;min-width:0}
.ptitle{font-size:26px;margin:0 0 2px}
.pdesc{color:var(--muted);margin:0 0 14px;max-width:860px}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:0 0 14px}
.meta span{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 9px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:13px;height:13px;border-radius:3px;display:inline-block;border:1px solid var(--line)}
.layers{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.layers.phone{grid-template-columns:375px minmax(0,1fr) minmax(0,1fr)}
.col h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.own{font-size:11px;font-weight:700;border-radius:10px;padding:1px 8px;border:1px solid}
.own.dev{color:var(--accent);border-color:var(--accent)}
.own.gel{color:var(--gel);border-color:var(--gel);background:var(--gelBg)}
.own.std{color:var(--std);border-color:var(--std);background:var(--stdBg)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.box.gelb{border-top:3px solid var(--gel)}
.box.stdb{border-top:3px solid var(--std)}
.box h4{margin:10px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.box h4:first-child{margin-top:0}
.box p{margin:4px 0}
ol.sec{margin:4px 0;padding-left:20px}
ol.sec li{margin:3px 0}
.hl{display:inline-block;min-width:24px;font-size:10.5px;font-weight:700;color:var(--gel);border:1px solid var(--gel);border-radius:4px;padding:0 4px;margin-right:4px;text-align:center}
ul.rules{list-style:none;padding:0;margin:0}
ul.rules li{padding:7px 0;border-bottom:1px solid var(--g1)}
ul.rules li:last-child{border-bottom:0}
.cite{display:block;font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:10px;padding:0 7px;margin-left:4px;vertical-align:1px;border:1px solid}
.tag.p{background:var(--pendBg);color:var(--pend);border-color:var(--pend)}
.tag.a{background:var(--addBg);color:var(--add);border-color:var(--add)}
.tag.r{background:var(--noBg);color:var(--no);border-color:var(--no)}
.chapter{max-width:960px}
.chapter section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.chapter section h3{margin:0 0 6px;font-size:16px}
table.own-t{width:100%;border-collapse:collapse;font-size:14px}
table.own-t th,table.own-t td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.own-t th{background:var(--g1)}
.pendcard{background:var(--pendBg);border:1px solid var(--pend);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.pendcard h3{margin:0 0 4px;font-size:15px;color:var(--pend)}
.pendcard p{margin:3px 0;font-size:14px}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:6px 0 6px 34px}
.steps li:before{content:counter(s);position:absolute;left:0;top:5px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;line-height:24px;font-size:12px;font-weight:700}
.mini{max-width:820px;margin:6px 0 14px}
.wf{border:2px solid var(--g3);border-radius:10px;overflow:hidden;background:var(--panel);container-type:inline-size}
.navmini{display:none;font-size:11px;color:var(--muted)}
@container (max-width:520px){ .nav{display:none} .navmini{display:inline} }
.note{display:block;font-size:11.5px;color:var(--accent);font-weight:600;margin-top:6px}
.note.p{color:var(--pend)}
.blk{padding:12px 14px;border-bottom:1px dashed var(--g2);position:relative}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:7px;display:flex;justify-content:space-between;gap:8px}
.lbl i{font-style:normal;color:var(--accent);font-weight:700}
.h2{height:13px;width:45%;background:var(--g3);border-radius:3px;margin-bottom:7px}
.ln{height:7px;background:var(--g2);border-radius:3px;margin:5px 0}
.ln.s{width:60%}.ln.m{width:80%}
.img{background:var(--g2);border-radius:6px;min-height:80px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.row{display:flex;gap:8px}
.row > *{flex:1 1 0;min-width:0}
.card{background:var(--g1);border-radius:8px;padding:7px}
.card .img{min-height:54px;margin-bottom:5px}
.card .t{font-size:12px;font-weight:700;margin:2px 0 4px}
.btn{display:inline-block;background:var(--accent);color:var(--accentInk);border-radius:16px;padding:3px 11px;font-size:12px;font-weight:600;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center}
.hdr{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px dashed var(--g2);position:relative}
.logo{font-weight:800;font-size:11.5px;border:1.5px dashed var(--muted);border-radius:4px;padding:3px 6px;white-space:nowrap}
.nav{display:flex;gap:1px;flex:1;flex-wrap:wrap;overflow:hidden}
.nav span{font-size:11px;padding:2px 5px;white-space:nowrap}
.nav span.dd:after{content:" \25BE";color:var(--muted)}
.burger{display:flex;flex-direction:column;gap:3px;padding:5px}
.burger i{display:block;width:18px;height:2px;background:var(--ink)}
.callic{font-size:11px;border:1px solid var(--line);border-radius:12px;padding:2px 8px;margin-left:auto}
.ddmenu{position:absolute;background:var(--panel);border:1px solid var(--g3);border-radius:6px;padding:5px;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.12);z-index:2}
.ddmenu div{padding:2px 8px}
.mmenu{background:var(--panel);border-top:1px dashed var(--g2);padding:6px 12px;font-size:13px}
.mmenu div{padding:4px 0;border-bottom:1px solid var(--g1)}
.mmenu .sub{padding-left:14px;color:var(--muted);font-size:12px}
.hero{background:var(--dark);color:var(--darkInk);text-align:center;padding:40px 14px;position:relative;border-bottom:1px dashed var(--g2)}
.hero.inner{padding:26px 14px}
.hero .vid{position:absolute;top:7px;left:9px;font-size:9.5px;letter-spacing:.06em;color:var(--darkMuted);border:1px solid var(--darkMuted);border-radius:3px;padding:1px 5px}
.hero .h1{font-size:20px;font-weight:800;margin:0 0 6px}
.hero .subt{color:var(--darkMuted);font-size:13px;margin-bottom:10px}
.hero .note{color:#9cc2ff}
.band{background:var(--dark);color:var(--darkInk)}
.band .lbl{color:var(--darkMuted)}
.band .note{color:#9cc2ff}
.band .note.p{color:#ffcf66}
.ctaband{background:var(--accent);color:var(--accentInk);text-align:center;padding:18px 14px}
.ctaband .h2{background:rgba(255,255,255,.7);margin:0 auto 9px}
.ctaband .btn{background:#fff;color:#1f3f7a}
.ctaband .lbl{color:rgba(255,255,255,.85);justify-content:center}
.ctaband .note{color:#fff}
.ctaband .note.p{color:#fff3c4}
.field{height:20px;border:1px solid #56626f;border-radius:4px;margin:4px 0;background:rgba(255,255,255,.06)}
.light .field{border-color:var(--g3);background:var(--panel)}
.chk{font-size:11px;color:var(--darkMuted);margin:3px 0;display:flex;gap:6px;align-items:flex-start}
.light .chk{color:var(--muted)}
.chk:before{content:"";width:11px;height:11px;border:1.5px solid currentColor;border-radius:2px;flex:0 0 auto;margin-top:2px}
.small{font-size:11px;color:var(--muted)}
.band .small{color:var(--darkMuted)}
.faqr{display:flex;justify-content:space-between;background:var(--g1);border-radius:5px;padding:5px 9px;margin:4px 0;font-size:12px}
.faqr:after{content:"+";color:var(--muted)}
.more{font-size:12px;color:var(--muted);text-align:center;margin-top:3px}
.logos{display:flex;gap:7px}
.logos div{flex:1;height:30px;border:1.5px solid #8c97a5;border-radius:4px;background:rgba(255,255,255,.06)}
.chip{display:inline-block;background:var(--g1);border:1px solid var(--g2);border-radius:12px;padding:1px 8px;font-size:11.5px;margin:2px 3px 2px 0}
.chip.link{color:var(--accent);border-color:var(--accent);background:transparent}
.step{background:var(--g1);border-radius:8px;padding:7px;text-align:center;font-size:12px}
.step b{display:block;font-size:15px;color:var(--accent)}
.nofaq{border:2px dashed var(--no);background:var(--noBg);color:var(--no);text-align:center;font-weight:700;font-size:13px;padding:9px;margin:8px 14px;border-radius:6px}
.fcols{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr 1.2fr;gap:10px;font-size:11px}
.fcols .ft{font-weight:700;margin-bottom:3px;color:var(--darkInk)}
.fcols div div{color:var(--darkMuted);padding:1px 0}
.fbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid #45505d;margin-top:10px;padding-top:7px;font-size:11px;color:var(--darkMuted)}
.fbar u{color:#9cc2ff}
.map{background:repeating-linear-gradient(45deg,var(--g1),var(--g1) 8px,var(--g2) 8px,var(--g2) 16px);border-radius:6px;min-height:64px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.slider{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.slider > *{flex:0 0 78%;scroll-snap-align:start}
.dots{text-align:center;font-size:13px;color:var(--muted);letter-spacing:3px}
.quote{font-size:12px;color:var(--muted);font-style:italic}
.phone .split{grid-template-columns:1fr}
.phone .fcols{grid-template-columns:1fr}
.phone .stack{flex-direction:column}
@media (max-width:1250px){
  .layers,.layers.phone{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .layers .col.wire{grid-row:span 2}
}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  nav.side{position:static;max-height:none;display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  nav.side .grp{display:none}
  nav.side button{width:auto;white-space:nowrap;flex:0 0 auto}
  .layers,.layers.phone{grid-template-columns:minmax(0,1fr)}
  .layers .col.wire{grid-row:auto}
  .nav{display:none}
  .fcols{grid-template-columns:1fr 1fr}
}
@media (max-width:480px){
  .split{grid-template-columns:1fr}
  .fcols{grid-template-columns:1fr}
  .top h1 small{display:none}
  .ptitle{font-size:22px}
}
</style>
</head>
<body>
<div class="top">
  <h1>Apex Website Standard<small>One guide for every Apex website: layout, content and team standards. Example client: Example Builders.</small></h1>
  <div class="toggle" role="group" aria-label="Wireframe size">
    <button id="bDesk" class="on" type="button">Desktop</button>
    <button id="bPhone" type="button">Phone</button>
  </div>
</div>
<div class="layout">
  <nav class="side" id="side" aria-label="Guide chapters"></nav>
  <main id="main"></main>
</div>

<script>
(function(){
/* ======================= GUIDE DATA ======================= */
var LAST_UPDATED = "Nov 23, 2026 (LA)";
var SOURCES = [
 "Layout workflow, workflows/developer-layout-workflow.md (Nov 23, with Aryan's Nov 23 rulings)",
 "Gelmarc's Page-by-Page Website Workflow, Google Doc 1vcfNmyldq5y0H_mADSxokD2qe-twiWL6KUfbT4_yVi4 (Start Here and DRAFT 01 to 15, read Nov 23)",
 "Aryan's final rulings, Nov 23 (13 rulings, relayed by the QC controller chat)",
 "Published sites case study, workflows/published-sites-case-study-2026-11-23.md (20 live Apex sites, 796 pages: the de facto standard)",
 "Layout workflow audit, workflows/layout-workflow-audit-2026-11-23.md (30 missing team rules; its 11 conflicts now ruled)",
 "Team rules, HQ/Rules.md (Slack, Podio and huddle rules, LA dates, as of Nov 23)",
 "Huddle notes, workflows/huddle-2026-11-20/NOTES.md (format call and team huddle, Nov 20)",
 "Huddle context, claude-context/huddle-context/ (Nov 2, 3, 4, 6, 9, 11, 12, 18 huddles)"
];

/* Citations: who, LA date, source. Tags: P = Pending Aryan, A = added from the Nov 23 audit (a team rule missing from the old workflow), R = replaced */
function R(t,c,tag){ return {t:t,c:c,tag:tag||""}; }

var CH = {};

CH.owners = {name:"Who owns what", grp:"Start here", desc:"Every rule in this guide belongs to one owner. When in doubt, the owner's latest word counts.",
 html:function(){ return '<div class="chapter"><section><table class="own-t"><tr><th>Who</th><th>Owns</th><th>Source</th></tr>'+
 '<tr><td><b>Developer</b> (Aryan, John)</td><td>Layout: header, menu, hero, section order, forms, buttons, footer, page types, Duda build, cookie banner and Termly, photos, layout QC and fixes.</td><td class="small">Mary, Nov 20 call and Slack; Mary, Oct 26 (photos); QC playbook section 1</td></tr>'+
 '<tr><td><b>Gelmarc</b></td><td>Content and SEO: copy, headings, FAQs, page and service names, metadata, schema, keyword map, GBP, GA4 and GTM (after launch). Updates content on Duda directly.</td><td class="small">Mary, Nov 19 and 20, Slack; Mary and Gelmarc, Nov 13, Slack</td></tr>'+
 '<tr><td><b>Mary</b></td><td>Client facts, scope and page count, process, the final review after QC, policy wording questions.</td><td class="small">QC playbook section 1; Mary, Nov 20, Slack</td></tr>'+
 '<tr><td><b>Anthony</b></td><td>Site standards, design direction and approvals (usually through Mary or the huddle). Rebrands start with him.</td><td class="small">Mary, Nov 4 and Nov 18, Slack</td></tr>'+
 '<tr><td><b>Paid ads team</b></td><td>The master format for opt-ins, Privacy Policy and Terms.</td><td class="small">Mary, Nov 5 and Nov 21, Slack; Gelmarc\'s Start Here</td></tr>'+
 '</table></section>'+
 rulesSection("Ownership rules",[
  R("Developers keep their own layout workflow; Gelmarc keeps his content workflow. Once both are ready, every ongoing project runs through both.","Mary, Nov 20, Slack and format call"),
  R("Gelmarc updates content and SEO directly on Duda and asks the developer only when layout is affected.","Mary, Nov 19, repeated Nov 20, Slack"),
  R("Content route: the developer drafts the first content using Gelmarc's workflow, then Gelmarc audits it. After that, content updates are Gelmarc's.","Aryan, Nov 23; Mary, Nov 17, Slack"),
  R("Aryan focuses on QC and client revisions; John takes new project development. Aryan can port John's designs to Duda.","Mary, Nov 16, Slack; Nov 20 team huddle"),
  R("Content questions go to Gelmarc; if he must act, assign him a Podio task.","Mary, Oct 20, Slack"),
  R("Know your role and which tasks are yours.","Mary, Nov 17, Slack")
 ])+'</div>'; }};

CH.before = {name:"Before building", grp:"Start here", desc:"Get the facts from Podio first. The project's Website Pages document decides which pages exist.",
 rules:[
  ["Podio facts",[
   R("Open the Podio project and read every field, file, comment, task and attachment: client profile, website type, page list, folder, onboarding, brief, brand files.","Mary, Nov 20, Slack"),
   R("The Podio Website Pages document decides the pages. Build exactly that list. S.R. Freeman is a good structure sample but a large site: copy its structure, never its page count.","Aryan, Nov 23 ruling; Mary, Nov 20, Slack"),
   R("Privacy and policy pages do not count toward the page total.","Mary, Nov 20, Slack"),
   R("A page beyond the list (for example asked for in a meeting) goes to Mary for scope confirmation before building. Pruneyard's room pages became a section and stayed drafts.","Mary, Nov 20, Slack"),
   R("Business details (name, phone, email, address, hours, license, social links, GBP) come only from Podio files and onboarding. Never assume or copy a detail from the web. No business address in Podio means a service-area site (Chendo: service areas, no home address). Ask Mary only for what is truly missing.","Aryan, Nov 23 ruling; layout workflow section 0"),
   R("For a redesign, save screenshots of the old site before starting.","Mary, Nov 12 team meeting","A"),
   R("For a migration or rebrand, map every old URL to its new destination (301 redirects).","Gelmarc's Start Here; Mary, Nov 8 (QC rule R9)")
  ]],
  ["Brand",[
   R("The client's brand guide wins over any reference: official logo files, exact colours, only the guide's fonts (serif headings included). Remove marks that are not official.","Aryan, Nov 13 and Nov 23 ruling; Mary (Anthony), Truehaven, Nov 19, Slack"),
   R("No logo files yet: ask Mary to request them, and meanwhile match colours from the client's business card or existing materials.","Anthony, Nov 6 huddle","A"),
   R("Branding check before any design: \u201cprojects requiring rebranding route through Anthony first, while pre-branded projects route directly to the developer.\u201d Has branding: straight to the developer. Needs rebranding: Anthony first, then the developer once his approved branding arrives.","Mary (relaying Anthony's huddle), Nov 18, Slack"),
   R("Examples: REF Builders, \u201cDevelopment will use REF Builders' existing branding.\u201d Truehaven, the cross-shaped T icon was removed because \u201cit wasn't part of the official branding.\u201d","Mary, Nov 9 (REF Builders); Mary relaying Anthony, Nov 19 (Truehaven), Slack")
  ]],
  ["References",[
   R("Structure comes from launched Apex sites only (S.R. Freeman, Casa Mora, Legacy, Immaculate Cleaning). Never use unpublished drafts as references.","Mary, Nov 20 format call and team huddle"),
   R("Design references (ThemeForest, Envato, any site) give the look only, never the page format or content. Pick a different reference per project, or per section.","Mary, Nov 20 and Nov 18, Slack"),
   R("Each site must look different from earlier Apex sites; never reuse the same section designs across clients.","Anthony, Nov 11 huddle; Mary, Nov 18 huddle","A"),
   R("WordPress clients: same rules, built so it is easy to rebuild in WordPress and Elementor.","Mary, Nov 20 format call")
  ]],
  ["Before any Duda edit",[
   R("Save a native Site Backup inside the Duda editor and record its name and date. Never duplicate the site on the dashboard.","Mary, Nov 16 and Nov 18, Slack; Gelmarc's Start Here","A")
  ]]
 ]};

CH.concepts = {name:"Concepts to Anthony", grp:"Start here", desc:"How a new site goes from brief to an approved direction before the full build.",
 rules:[
  ["New website flow",[
   R("(1) Onboarding and Anthony's Creative Direction Form, developer reviews scope. (2) Gelmarc prepares SEO and content requirements. (3) Developer makes initial content and layout options, Gelmarc refines. (4) Anthony approves the direction before the full Duda build. (5) Build: developer layout and function, Gelmarc content and metadata. (6) QC: developer across devices, Gelmarc SEO. (7) Launch, then check the live site.","Mary, Nov 18, Slack"),

CH.content = {name:"Content and SEO rules", grp:"Start here", desc:"Gelmarc owns this layer. The developer follows it in the first build prompt and never rewrites it later.",
 rules:[

  gel:{order:[["H1","Terms and Conditions: business name and approved effective date."],["–","Introduction: master-file wording."],["H2","Types of Messages You Will Receive."],["H2","SMS Unsubscribe / Opt-Out Instructions (HELP, frequency, rates)."],["H2","Carrier Disclaimer."],["H2","Consent Not Required for Purchase."],["H2","Age Requirement."],["H2","Privacy Policy."],["H2","Changes to These Terms."]],
   copy:"Use the full client-specific Terms from the master file. Replace the Privacy Policy placeholder with its actual link. Extra terms go to the paid ads team.",
   faq:"10, after the terms", meta:"Title: Terms and Conditions | [Brand]. Description: the scope of the terms and messaging program.",
   check:"Business identity, dates, support details, links, consistency with form notices. Review before publication."},
  std:[R("Terms “daily messages” vs opt-in “frequency varies”: change nothing, add to the team question list.","Aryan's own rule, Nov 3 (QC rule R6)")]}
];

/* ======================= RENDER HELPERS ======================= */
var mode='desk', current='pt-home';
try{ mode=localStorage.getItem('aws-mode')||'desk'; }catch(e){}
try{ current=(location.hash||'').slice(1)||localStorage.getItem('aws-page')||'pt-home'; }catch(e){}
function ph(){ return mode==='phone'; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function tagHTML(t){ if(t==='P') return '<span class="tag p">Pending Aryan</span>'; if(t==='A') return '<span class="tag a">Added Nov 23</span>'; if(t==='R') return '<span class="tag r">Replaced</span>'; if(t==='N') return '<span class="tag p">Pending Anthony</span>'; if(t==='F') return '<span class="tag p">Future, per Gelmarc</span>'; return ''; }
function ruleLi(r){ return '<li>'+esc(r.t)+tagHTML(r.tag)+'<span class="cite">'+esc(r.c)+'</span></li>'; }
function rulesSection(title,list){ return '<section><h3>'+title+'</h3><ul class="rules">'+list.map(ruleLi).join('')+'</ul></section>'; }
function lines(n){ var s='',w=['','m','','s']; for(var i=0;i<n;i++) s+='<div class="ln '+w[i%4]+'"></div>'; return s; }
function lbl(t,right){ return '<div class="lbl"><span>'+t+'</span>'+(right?'<i>'+right+'</i>':'')+'</div>'; }
function noteHTML(bk){ var h=''; if(bk.note) h+='<span class="note">'+esc(bk.note)+'</span>'; if(bk.o.pending) h+='<span class="note p">Pending Aryan: '+esc(bk.o.pending)+'</span>'; return h; }

function header(open,forcePhone){
  if(ph()||forcePhone) return '<div class="hdr"><span class="logo">EXAMPLE BUILDERS</span><span class="callic">Call</span><span class="burger"><i></i><i></i><i></i></span></div>';
  var nav='<span>Home</span><span class="dd">About</span><span class="dd">Services</span><span class="dd">Projects</span><span class="dd">Service Areas</span><span>Contact</span>';
  var h='<div class="hdr"><span class="logo">EXAMPLE BUILDERS</span><div class="nav">'+nav+'</div><span class="navmini">One-line menu</span><span class="callic">Call</span><span class="btn">Get a Quote</span>';
  if(open) h+='<div class="ddmenu" style="left:38%;top:34px">'+SVC.map(function(s){return '<div>'+s+'</div>';}).join('')+'</div>';
  return h+'</div>';
}
function cardsHTML(o){
  var n=o.n||3,out=[];
  for(var i=0;i<n;i++){
    var name=(o.names&&o.names[i])||'',c='<div class="card">';
    if(!o.noimg) c+='<div class="img">'+(o.people?'Real photo':'Photo')+'</div>';
    c+=name?'<div class="t">'+name+'</div>':'<div class="ln m" style="height:9px;background:var(--g3)"></div>';
    c+=o.small?lines(1):lines(2);
    if(o.btn) c+='<span class="btn ghost">'+o.btn+'</span>';
    out.push(c+'</div>');
  }
  if(ph()&&(n>=3||o.slider)) return '<div class="slider">'+out.join('')+'</div><div class="dots">● ○ ○</div>';
  var cols=ph()?(o.small?2:1):Math.min(n,4);
  return '<div style="display:grid;grid-template-columns:repeat('+cols+',minmax(0,1fr));gap:8px">'+out.join('')+'</div>';
}
function formHTML(bk){
  var o=bk.o,f='<div class="blk '+(o.light?'light':'band')+'">'+lbl(bk.label);
  var fields=o.detailed?['Name','Phone','Email','City','Service needed','Project details']:['Name','Phone','Email','Message'];
  f+='<div style="display:grid;grid-template-columns:'+(ph()?'1fr':'1fr 1fr')+';gap:0 10px">';
  fields.forEach(function(x){ f+='<div><div class="small">'+x+'</div><div class="field"></div></div>'; });
  f+='</div>';
  if(o.sms) f+='<div class="chk">* I consent to receive non-marketing text messages ... (required)</div><div class="chk">* I consent to receive marketing text messages ... (required)</div>';
  f+='<div style="margin-top:7px"><span class="btn">Send Request</span></div><div class="small" style="margin-top:5px">Privacy Policy | Terms and Conditions</div>';
  return f+noteHTML(bk)+'</div>';
}
function footerHTML(bk){
  var list=function(a){ return a.map(function(s){return '<div>'+s+'</div>';}).join(''); };
  var cols='<div class="fcols"><div><span class="logo" style="color:#fff;border-color:#8c97a5">EXAMPLE BUILDERS</span><div style="margin-top:5px">Phone (tap to call)</div><div>email@lowercase</div><div>Address only from Podio</div><div>Hours, license if confirmed</div><div>Social, Yelp, GBP (verified)</div></div>'+
   '<div><div class="ft">Pages</div>'+list(['Home','About','FAQ','Blog','Contact'])+'</div><div><div class="ft">Services</div>'+list(SVC)+'</div><div><div class="ft">Projects</div>'+list(PRJ)+list(['Service Areas'])+'</div><div><div class="ft">Map</div><div class="map">Map</div></div></div>';
  var bar='<div class="fbar"><span>Privacy Policy | Terms and Conditions | Cookie preferences</span><span>© 2026 Example Builders | Designed &amp; Managed by <u>Apex Operations</u></span></div>';
  return '<div class="blk band">'+lbl(bk.label)+cols+bar+noteHTML(bk)+'</div>';
}
function render(bk){
  var o=bk.o,i,s,k=bk.kind,N=noteHTML(bk);
  switch(k){
    case 'header': return '<div style="position:relative">'+header(false)+(N?'<div style="padding:0 12px 8px">'+N+'</div>':'')+'</div>';
    case 'hero': return '<div class="hero'+(o.inner?' inner':'')+'"><span class="vid">'+(o.inner?'IMAGE OR VIDEO':'VIDEO, FULL SCREEN')+'</span><div class="h1">'+(o.h1||'Page Title')+'</div>'+(o.inner?'':'<div class="subt">Short subtitle, one line</div><span class="btn">Get a Quote</span>')+N+'</div>';
    case 'split': return '<div class="blk">'+lbl(bk.label)+'<div class="split"><div><div class="h2"></div>'+lines(3)+(o.btn?'<span class="btn ghost">'+o.btn+'</span>':'')+'</div><div class="img">Photo</div></div>'+N+'</div>';
    case 'text': return '<div class="blk">'+lbl(bk.label)+'<div class="h2"></div>'+lines(3)+N+'</div>';
    case 'cards': return '<div class="blk">'+lbl(bk.label,o.n+' card'+(o.n>1?'s':''))+'<div class="h2"></div>'+cardsHTML(o)+(o.extraLink?'<div style="margin-top:7px"><span class="btn ghost">'+o.extraLink+'</span></div>':'')+N+'</div>';
    case 'logos': return '<div class="blk band">'+lbl(bk.label)+'<div class="logos"><div></div><div></div><div></div>'+(ph()?'':'<div></div>')+'</div>'+N+'</div>';
    case 'steps': s=''; for(i=1;i<=o.n;i++) s+='<div class="step"><b>'+i+'</b>Step</div>'; return '<div class="blk">'+lbl(bk.label)+'<div class="h2"></div><div class="row'+(ph()?' stack':'')+'">'+s+'</div>'+N+'</div>';
    case 'areas': return '<div class="blk">'+lbl(bk.label)+'<div class="h2"></div><div class="split"><div class="map">County map</div><div>'+CITY.map(function(c){return '<span class="chip link">'+c+'</span>';}).join('')+'</div></div>'+N+'</div>';
    case 'reviews': s=[]; for(i=0;i<3;i++) s.push('<div class="card"><div class="quote">“Verified review”</div><div class="small">Name, City</div></div>'); return '<div class="blk">'+lbl(bk.label)+'<div class="h2"></div>'+(ph()?'<div class="slider">'+s.join('')+'</div>':'<div class="row">'+s.join('')+'</div>')+N+'</div>';
    case 'faq': s=''; for(i=1;i<=3;i++) s+='<div class="faqr">Question '+i+'</div>'; return '<div class="blk">'+lbl(bk.label,o.n+' questions')+s+'<div class="more">… '+o.n+' in total</div>'+N+'</div>';
    case 'faqgroups': s=''; ['Services','Process','Coverage','Getting started'].forEach(function(t){ s+='<div style="margin:6px 0 2px;font-weight:700;font-size:12px">'+t+'</div><div class="faqr">Question</div>'; }); return '<div class="blk">'+lbl(bk.label,'20 questions')+s+'<div class="more">… about 5 per group, 20 in total</div>'+N+'</div>';
    case 'cta': return '<div class="ctaband">'+lbl(bk.label)+'<div class="h2" style="width:50%"></div><span class="btn">Get a Quote</span>'+(o.svcLink?' <span class="btn" style="background:transparent;color:#fff;border:1px solid #fff">Service One</span>':'')+'<div>'+N+'</div></div>';
    case 'form': return formHTML(bk);
    case 'footer': return footerHTML(bk);
    case 'none': return '<div class="nofaq">'+bk.label+'</div>';
    case 'future': return '<div class="blk" style="border:2px dashed var(--g3);margin:8px 14px;border-radius:6px;opacity:.75">'+lbl(bk.label,'Future')+N+'</div>';
    case 'chips': return '<div class="blk">'+lbl(bk.label)+o.items.map(function(c){return '<span class="chip'+(o.link?' link':'')+'">'+c+'</span>';}).join('')+N+'</div>';
    case 'stats': return '<div class="blk">'+lbl(bk.label)+'<div class="row"><div class="card small" style="text-align:center">Result</div><div class="card small" style="text-align:center">Result</div><div class="card small" style="text-align:center">Result</div></div>'+N+'</div>';
    case 'gallery': s=''; for(i=0;i<(ph()?4:6);i++) s+='<div class="img" style="min-height:50px">Photo</div>'; return '<div class="blk">'+lbl(bk.label)+'<div style="display:grid;grid-template-columns:repeat('+(ph()?2:3)+',1fr);gap:7px">'+s+'</div>'+N+'</div>';
    case 'mapblk': return '<div class="blk">'+lbl(bk.label)+'<div class="map" style="min-height:110px">Coverage map</div>'+N+'</div>';
    case 'regions': s=''; ['County One','County Two'].forEach(function(cn,ix){ s+='<div class="card"><div class="t">'+cn+'</div>'+CITY.slice(ix*3,ix*3+3).map(function(c){return '<span class="chip link">'+c+'</span>';}).join('')+'</div>'; }); return '<div class="blk">'+lbl(bk.label)+'<div class="row'+(ph()?' stack':'')+'">'+s+'</div>'+N+'</div>';
    case 'filters': return '<div class="blk">'+lbl(bk.label)+'<span class="chip">All</span><span class="chip">Topic</span><span class="chip">Topic</span>'+N+'</div>';
    case 'article': return '<div class="blk">'+lbl(bk.label)+'<div class="h2"></div>'+lines(3)+'<div class="h2" style="width:35%"></div>'+lines(3)+N+'</div>';
    case 'contactinfo': return '<div class="blk">'+lbl(bk.label)+'<div class="split"><div><div class="small">Phone (tap to call)</div><div class="small">Email</div><div class="small">Hours, license (if confirmed)</div></div><div class="map">Map</div></div>'+N+'</div>';
    case 'policy': return '<div class="blk">'+lbl(bk.label)+'<div class="h2"></div>'+lines(4)+'<div class="h2" style="width:30%"></div>'+lines(4)+'<div class="more">… full master text</div>'+N+'</div>';
  }
  return '';
}
function wireframe(blocks){ return '<div class="wf'+(ph()?' phone':'')+'" style="'+(ph()?'max-width:375px':'')+'">'+blocks.map(render).join('')+'</div>'; }
function headerWire(){
  var h='<div class="wf" style="'+(ph()?'max-width:375px':'')+'">';
  h+='<div style="position:relative;padding-bottom:'+(ph()?'0':'64px')+'">'+header(!ph())+'</div>';
  h+='<div class="small" style="padding:6px 12px">Phone menu, opened:</div><div style="max-width:375px">'+header(false,true)+'<div class="mmenu"><div>Home</div><div>About ▾</div><div class="sub">FAQ</div><div class="sub">Blog</div><div>Services ▾</div>'+SVC.map(function(x){return '<div class="sub">'+x+'</div>';}).join('')+'<div>Projects ▾</div><div>Service Areas ▾</div><div>Contact</div><div style="border:0;padding-top:6px"><span class="btn">Get a Quote</span></div></div></div></div>';
  return h;
}
function footerWire(){ return wireframe([b('form','1. Form band (compulsory; hidden on Contact)','Quick inquiry form, two required SMS boxes',{sms:true}),b('footer','2. Main footer and 3. bottom bar','Address only from Podio; credit line exactly as Freeman')]); }

/* ======================= NAV + DRAW ======================= */
var NAV=[
 {grp:'Start here',items:['owners','before','live','concepts','staging','content']},
 {grp:'Global',items:['header','footer','forms','design','facts']},
 {grp:'Page types',items:PT.map(function(p){return 'pt-'+p.id;})},
 {grp:'Build and check',items:['duda','qc','showing']},
 {grp:'Open items',items:['pending','current']}
];
function itemName(id){ if(id.indexOf('pt-')===0){ var p=PT.filter(function(x){return 'pt-'+x.id===id;})[0]; return p?p.name:id; } return CH[id]?CH[id].name:id; }
function allIds(){ var a=[]; NAV.forEach(function(g){ a=a.concat(g.items); }); return a; }
function drawNav(){
  var h='';
  NAV.forEach(function(g){ h+='<div class="grp">'+g.grp+'</div>'; g.items.forEach(function(id){ h+='<button type="button" data-id="'+id+'" class="'+(id===current?'on':'')+'">'+itemName(id)+'</button>'; }); });
  document.getElementById('side').innerHTML=h;
  try{ var on=document.querySelector('nav.side button.on'); if(on && window.innerWidth<=900) on.scrollIntoView({block:'nearest',inline:'center'}); }catch(err){}
  document.getElementById('bDesk').className=mode==='desk'?'on':'';
  document.getElementById('bPhone').className=mode==='phone'?'on':'';
}
function metaBar(){
  return '<div class="meta"><span>Last updated: '+LAST_UPDATED+'</span><span>Sources checked: '+SOURCES.length+' (listed under How this guide stays current)</span><span>Aryan\u2019s final rulings applied; not yet reviewed by Mary</span></div>';
}
function legend(){
  return '<div class="legend"><span><i class="sw" style="background:var(--accent)"></i>Layout (developer)</span><span><i class="sw" style="background:var(--gelBg);border-color:var(--gel)"></i>Content (Gelmarc owns)</span><span><i class="sw" style="background:var(--stdBg);border-color:var(--std)"></i>Team standards</span><span><span class="tag p">Future, per Gelmarc</span> not required now</span><span><span class="tag a">Added Nov 23</span> team rule missing from the old workflow</span></div>';
}
function draw(){
  var ids=allIds(); if(ids.indexOf(current)<0) current='pt-home';
  drawNav();
  var m='';
  if(current.indexOf('pt-')===0){
    var p=PT.filter(function(x){return 'pt-'+x.id===current;})[0], g=p.gel;
    m+='<h2 class="ptitle">'+p.name+'</h2><p class="pdesc">'+esc(p.desc)+'</p>'+metaBar()+legend();
    m+='<div class="layers'+(ph()?' phone':'')+'">';
    m+='<div class="col wire"><h3>Layout <span class="own dev">Developer</span></h3>'+wireframe(p.wire)+'<p class="small" style="margin-top:6px">Source: layout workflow sections 3 and 7, with Aryan’s Nov 23 rulings.</p></div>';
    m+='<div class="col"><h3>Content <span class="own gel">Gelmarc owns</span></h3><div class="box gelb"><h4>Purpose</h4><p>'+esc(p.desc)+'</p><h4>Section order and headings</h4><ol class="sec">'+g.order.map(function(x){return '<li><span class="hl">'+x[0]+'</span>'+esc(x[1])+'</li>';}).join('')+'</ol><h4>Copy and links</h4><p>'+esc(g.copy)+'</p><h4>FAQ count</h4><p>'+esc(g.faq)+'</p><h4>Metadata</h4><p>'+esc(g.meta)+'</p><h4>Page check</h4><p>'+esc(g.check)+'</p><p class="small" style="margin-top:8px">Source: Gelmarc’s Page-by-Page Website Workflow (Google Doc, read Nov 23). Content and SEO are his; developers do not rewrite them.</p></div></div>';
    m+='<div class="col"><h3>Standards <span class="own std">Mary, Anthony, huddles</span></h3><div class="box stdb"><ul class="rules">'+p.std.map(ruleLi).join('')+'</ul></div></div>';
    m+='</div>';
  } else {
    var c=CH[current];
    m+='<h2 class="ptitle">'+c.name+'</h2><p class="pdesc">'+esc(c.desc)+'</p>'+metaBar();
    if(current==='current') m+='<div class="chapter"><section><h3>Sources checked</h3><ul class="rules">'+SOURCES.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul></section></div>';
    if(c.wire==='header') m+='<div class="mini">'+headerWire()+'</div>';
    if(c.wire==='footer') m+='<div class="mini">'+footerWire()+'</div>';
    if(c.html) m+=c.html();
    if(c.rules){ m+='<div class="chapter">'; c.rules.forEach(function(sec){ m+=rulesSection(sec[0],sec[1]); }); m+='</div>'; }
  }
  document.getElementById('main').innerHTML=m;
}
document.getElementById('side').addEventListener('click',function(e){
  var t=e.target.closest('button[data-id]'); if(!t) return;
  current=t.getAttribute('data-id');
  try{ localStorage.setItem('aws-page',current); history.replaceState(null,'','#'+current); }catch(err){}
  draw(); window.scrollTo(0,0);
});
function setMode(x){ mode=x; try{ localStorage.setItem('aws-mode',x); }catch(err){} draw(); }
document.getElementById('bDesk').addEventListener('click',function(){ setMode('desk'); });
document.getElementById('bPhone').addEventListener('click',function(){ setMode('phone'); });
draw();
})();
</script>
